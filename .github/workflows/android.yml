name: android

on:
  workflow_dispatch:
    inputs:
      bump:
        description: version bump
        default: patch
        type: choice
        options: [patch, minor, major]
  push:
    branches: [main]
    paths:
      - "android/**"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for tags + versionCode

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: compute semver
        id: ver
        run: |
          LAST=$(git tag -l "android-v*" | sort -V | tail -1)
          BUMP="${{ inputs.bump || 'patch' }}"
          if [ -z "$LAST" ]; then
            VN="1.0.0"
          else
            IFS=. read -r MA MI PA <<< "${LAST#android-v}"
            case "$BUMP" in
              major) VN="$((MA + 1)).0.0" ;;
              minor) VN="$MA.$((MI + 1)).0" ;;
              *)     VN="$MA.$MI.$((PA + 1))" ;;
            esac
          fi
          VC=$(git rev-list --count HEAD)
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "building v$VN (code $VC)"

      - name: decode keystore
        run: echo "${ANDROID_KEYSTORE_B64}" | base64 -d > android/app/release.jks
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: build signed release apk
        run: |
          cd android && gradle assembleRelease --no-daemon -q \
            -PversionCode="${VC}" -PversionName="${VN}" \
            -PstoreFile=release.jks -PstorePass="aflow-release-2026" \
            -PkeyAlias=aflow -PkeyPass="aflow-release-2026"
        env:
          VC: ${{ steps.ver.outputs.vc }}
          VN: ${{ steps.ver.outputs.vn }}

      - name: publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.ver.outputs.vn }}
          name: "AFlow Android v${{ steps.ver.outputs.vn }}"
          body: "Signed release build. Over-install upgrades from any earlier signed version."
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: false

      - name: publish latest channel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: "AFlow Android (WebView shell)"
          body: "Latest signed APK. Also mirrored at https://aflow.dev/aflow.apk"
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: false
