name: android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: build debug apk
        run: cd android && gradle assembleDebug --no-daemon -q

      - name: publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: "AFlow Android (WebView shell)"
          body: "Pure WebView shell for https://aflow.dev — no GMS required. Install the APK (allow unknown sources), done."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
