name: android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: versionCode = commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: build debug apk
        run: |
          VC=$(git rev-list --count HEAD)
          VN="1.0.${VC}"
          echo "VERSION_NAME=${VN}" >> "$GITHUB_ENV"
          cd android && gradle assembleDebug --no-daemon -q -PversionCode="$VC" -PversionName="$VN"

      - name: publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION_NAME }}
          name: "AFlow Android ${{ env.VERSION_NAME }}"
          body: "Versioned snapshot of the WebView shell APK."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: false

      - name: publish latest channel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: "AFlow Android (WebView shell)"
          body: "Pure WebView shell for https://aflow.dev — no GMS required. Install the APK (allow unknown sources), done."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
