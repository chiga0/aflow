name: aflow-lite deploy

# Deploys aflow-lite to a VPS over SSH. Trigger manually from the Actions tab.
#
# Required repository secrets (Settings -> Secrets -> Actions):
#   LITE_SSH_TARGET        e.g. deploy@203.0.113.10
#   LITE_SSH_KEY           private key (ed25519/rsa) for that user
#   LITE_QWEN_SETTINGS_JSON  contents of ~/.qwen/settings.json (model creds)
# Optional secrets:
#   LITE_AUTH_EMAIL / LITE_AUTH_PASSWORD   web login (empty password => bootstrap)
#   LITE_QWEN_SERVER_TOKEN                 internal aflow<->qwen token
#   LITE_DOMAIN                            enables the Caddy HTTPS overlay
#
# The target host must have Docker + Compose v2 and outbound network access
# (to pull base images and `npm i -g @qwen-code/qwen-code`). This workflow
# deliberately uses its OWN secret namespace and never touches the legacy
# aflow `runtime-production` environment, so it cannot disturb a running
# classic aflow on the same or another host.

on:
  workflow_dispatch:
    inputs:
      qwen_version:
        description: "qwen CLI version baked into the qwen image"
        required: false
        default: "0.21.1"
        type: string
      remote_dir:
        description: "Install path on the VPS"
        required: false
        default: "/opt/aflow-lite"
        type: string

permissions:
  contents: read

concurrency:
  group: lite-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required secrets
        env:
          LITE_SSH_TARGET: ${{ secrets.LITE_SSH_TARGET }}
          LITE_SSH_KEY: ${{ secrets.LITE_SSH_KEY }}
          LITE_QWEN_SETTINGS_JSON: ${{ secrets.LITE_QWEN_SETTINGS_JSON }}
        run: |
          set -euo pipefail
          test -n "$LITE_SSH_TARGET" || { echo "missing LITE_SSH_TARGET"; exit 1; }
          test -n "$LITE_SSH_KEY" || { echo "missing LITE_SSH_KEY"; exit 1; }
          test -n "$LITE_QWEN_SETTINGS_JSON" || { echo "missing LITE_QWEN_SETTINGS_JSON"; exit 1; }

      - name: Pre-flight gates (only deploy green code)
        run: |
          set -euo pipefail
          bash -n lite/deploy/deploy_vps.sh
          python3 -W error::ResourceWarning -m unittest discover -s lite/runtime/tests

      - name: Prepare credentials
        env:
          LITE_SSH_KEY: ${{ secrets.LITE_SSH_KEY }}
          LITE_QWEN_SETTINGS_JSON: ${{ secrets.LITE_QWEN_SETTINGS_JSON }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/lite-deploy"
          printf '%s\n' "$LITE_SSH_KEY" > "$RUNNER_TEMP/lite-deploy/key"
          chmod 600 "$RUNNER_TEMP/lite-deploy/key"
          printf '%s\n' "$LITE_QWEN_SETTINGS_JSON" > "$RUNNER_TEMP/lite-deploy/qwen-settings.json"
          chmod 600 "$RUNNER_TEMP/lite-deploy/qwen-settings.json"
          eval "$(ssh-agent -s)"
          ssh-add "$RUNNER_TEMP/lite-deploy/key"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Sync source + write remote config
        env:
          TARGET: ${{ secrets.LITE_SSH_TARGET }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
          QWEN_VERSION: ${{ inputs.qwen_version }}
          AFLOW_AUTH_EMAIL: ${{ secrets.LITE_AUTH_EMAIL }}
          AFLOW_AUTH_PASSWORD: ${{ secrets.LITE_AUTH_PASSWORD }}
          QWEN_SERVE_TOKEN: ${{ secrets.LITE_QWEN_SERVER_TOKEN }}
          AFLOW_DOMAIN: ${{ secrets.LITE_DOMAIN }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30"
          ssh $SSH_OPTS "$TARGET" "mkdir -p '$REMOTE_DIR' ~/.qwen"
          rsync -az --delete \
            --exclude node_modules --exclude dist --exclude data \
            --exclude '*.db' --exclude '*.db-*' --exclude BOOTSTRAP_PASSWORD.txt --exclude .git \
            -e "ssh $SSH_OPTS" \
            lite/ "$TARGET:$REMOTE_DIR/lite/"
          # model credentials on the remote (mounted read-only by compose)
          scp $SSH_OPTS "$RUNNER_TEMP/lite-deploy/qwen-settings.json" "$TARGET":/tmp/qwen-settings.json
          ssh $SSH_OPTS "$TARGET" "install -m 600 /tmp/qwen-settings.json ~/.qwen/settings.json && rm -f /tmp/qwen-settings.json"
          # runtime .env
          {
            echo "AFLOW_AUTH_EMAIL=${AFLOW_AUTH_EMAIL:-admin@aflow.local}"
            echo "AFLOW_AUTH_PASSWORD=${AFLOW_AUTH_PASSWORD:-}"
            echo "QWEN_SERVE_TOKEN=${QWEN_SERVE_TOKEN:-aflow-internal-token-change-me}"
            echo "QWEN_VERSION=${QWEN_VERSION}"
            echo "AFLOW_DOMAIN=${AFLOW_DOMAIN:-}"
          } | ssh $SSH_OPTS "$TARGET" "cat > '$REMOTE_DIR/lite/deploy/.env' && chmod 600 '$REMOTE_DIR/lite/deploy/.env'"

      - name: Build + start stack on VPS
        env:
          TARGET: ${{ secrets.LITE_SSH_TARGET }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
          AFLOW_DOMAIN: ${{ secrets.LITE_DOMAIN }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=40"
          COMPOSE="docker compose -f lite/deploy/docker-compose.yml"
          if [ -n "${AFLOW_DOMAIN:-}" ]; then
            COMPOSE="$COMPOSE -f lite/deploy/docker-compose.https.yml"
          fi
          ssh $SSH_OPTS "$TARGET" "cd '$REMOTE_DIR' && $COMPOSE up -d --build"

      - name: Verify health on VPS
        env:
          TARGET: ${{ secrets.LITE_SSH_TARGET }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=accept-new"
          ssh $SSH_OPTS "$TARGET" 'for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/api/health >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:8765/api/health; echo; exit 0
            fi
            sleep 3
          done; echo "runtime did not become healthy"; exit 1'
