name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: runtime unit tests
        run: python3 -m unittest discover -s runtime/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: build
        working-directory: web
        run: npm run build
