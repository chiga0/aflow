name: aflow-lite init+deploy (bare-metal)

# One-shot bootstrap of a FRESH host (e.g. just-reinstalled VPS) using the
# legacy RUNTIME_* secrets, executed from a GitHub runner (local outbound
# networking to the host is unreliable; runners reach it fine).
#
# Bare-metal (no Docker): installs python3 + NodeSource node 24, syncs the lite
# tree (with a runner-built web dist to avoid on-host vite OOM), writes
# ~/.qwen/settings.json + the runtime .env from secrets, installs qwen via npm,
# starts qwen serve + the runtime, then verifies health + login + a REAL
# mission (remote_mission_smoke.sh) so a model/plan outage fails the run.
#
# Gated to edits of THIS file only, so it runs solely when we intentionally
# push a change to it. Reuses legacy secrets (read/use only):
#   RUNTIME_SSH_TARGET, RUNTIME_SSH_KEY, QWEN_SETTINGS_JSON,
#   RUNTIME_AUTH_EMAIL, RUNTIME_AUTH_PASSWORD.

on:
  push:
    paths:
      - ".github/workflows/lite-init.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare credentials
        env:
          SSH_KEY: ${{ secrets.RUNTIME_SSH_KEY }}
          QWEN_SETTINGS_JSON: ${{ secrets.QWEN_SETTINGS_JSON }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "missing RUNTIME_SSH_KEY"; exit 2; }
          install -d -m 700 "$RUNNER_TEMP/lite"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/lite/key"; chmod 600 "$RUNNER_TEMP/lite/key"
          printf '%s\n' "$QWEN_SETTINGS_JSON" > "$RUNNER_TEMP/lite/qwen-settings.json"; chmod 600 "$RUNNER_TEMP/lite/qwen-settings.json"
          eval "$(ssh-agent -s)"; ssh-add "$RUNNER_TEMP/lite/key"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          echo "QWEN_SETTINGS_FILE=$RUNNER_TEMP/lite/qwen-settings.json" >> "$GITHUB_ENV"

      - name: Install base deps on host (apt; NodeSource node 24 — qwen needs >=20)
        env:
          TARGET: ${{ secrets.RUNTIME_SSH_TARGET }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new "$TARGET" '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 git curl rsync ca-certificates
            if ! node --version 2>/dev/null | grep -qE "v24"; then
              curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nodejs
            fi
            node --version && npm --version
          '

      - name: Write runtime .env (auth from legacy secrets)
        env:
          TARGET: ${{ secrets.RUNTIME_SSH_TARGET }}
          AUTH_EMAIL: ${{ secrets.RUNTIME_AUTH_EMAIL }}
          AUTH_PASSWORD: ${{ secrets.RUNTIME_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          {
            echo "AFLOW_AUTH_EMAIL=${AUTH_EMAIL:-admin@aflow.local}"
            echo "AFLOW_AUTH_PASSWORD=\"${AUTH_PASSWORD:-}\""
            echo "QWEN_SERVE_TOKEN=aflow-internal-token-$(date +%s)"
            echo "QWEN_VERSION=0.21.1"
          } > "$RUNNER_TEMP/lite/.env"
          chmod 600 "$RUNNER_TEMP/lite/.env"
          mkdir -p lite/deploy
          cp "$RUNNER_TEMP/lite/.env" lite/deploy/.env

      - name: Build web on runner (VPS may be low-memory; avoid vite OOM on-host)
        working-directory: lite/web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html

      - name: Deploy (bare-metal, no Docker) via deploy_baremetal.sh
        env:
          TARGET: ${{ secrets.RUNTIME_SSH_TARGET }}
        run: |
          set -euo pipefail
          bash lite/deploy/deploy_baremetal.sh "$TARGET" /opt/aflow-lite

      - name: Verify health + login + real mission over loopback
        env:
          TARGET: ${{ secrets.RUNTIME_SSH_TARGET }}
          AUTH_EMAIL: ${{ secrets.RUNTIME_AUTH_EMAIL }}
          AUTH_PASSWORD: ${{ secrets.RUNTIME_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          ssh "$TARGET" 'curl -fsS http://127.0.0.1:8765/api/health'
          EMAIL="${AUTH_EMAIL:-admin@aflow.local}"
          BODY=$(printf '{"email":"%s","password":"%s"}' "$EMAIL" "$AUTH_PASSWORD")
          for i in $(seq 1 15); do
            code=$(ssh "$TARGET" "curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '$BODY' http://127.0.0.1:8765/api/auth/login")
            [ "$code" = 200 ] && { echo "login ok"; break; }
            sleep 2
            [ "$i" = 15 ] && { echo "login never 200"; exit 1; }
          done
          ssh "$TARGET" "bash /opt/aflow-lite/lite/scripts/remote_mission_smoke.sh '$EMAIL' '$AUTH_PASSWORD'"

# re-deploy to pick up HEAD-support server.py
