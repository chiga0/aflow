name: aflow-lite model check

# Applies the (renewed) qwen settings from the QWEN_SETTINGS_JSON secret to the
# VPS, restarts qwen serve, and runs a real mission to confirm the agent now
# produces a reply (previously 403 "token plan expired"). Does NOT change the
# model name — it uses whatever the settings specify.
# Gated to edits of THIS file only.

on:
  push:
    paths:
      - ".github/workflows/lite-modelcheck.yml"

permissions:
  contents: read

jobs:
  modelcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare credentials
        env:
          SSH_KEY: ${{ secrets.RUNTIME_SSH_KEY }}
          QWEN_SETTINGS_JSON: ${{ secrets.QWEN_SETTINGS_JSON }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/k"; chmod 600 "$RUNNER_TEMP/ssh/k"
          printf '%s\n' "$QWEN_SETTINGS_JSON" > "$RUNNER_TEMP/ssh/settings.json"; chmod 600 "$RUNNER_TEMP/ssh/settings.json"
          eval "$(ssh-agent -s)"; ssh-add "$RUNNER_TEMP/ssh/k"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Apply settings + restart qwen + run mission
        env:
          TARGET: ${{ secrets.RUNTIME_SSH_TARGET }}
          AUTH_EMAIL: ${{ secrets.RUNTIME_AUTH_EMAIL }}
          AUTH_PASSWORD: ${{ secrets.RUNTIME_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          EMAIL="${AUTH_EMAIL:-admin@aflow.local}"
          BODY=$(printf '{"email":"%s","password":"%s"}' "$EMAIL" "$AUTH_PASSWORD")
          # push renewed settings to the host (via ssh stdin, no scp)
          ssh -o StrictHostKeyChecking=accept-new "$TARGET" 'mkdir -p /root/.qwen'
          ssh -o StrictHostKeyChecking=accept-new "$TARGET" 'cat > /root/.qwen/settings.json && chmod 600 /root/.qwen/settings.json' < "$RUNNER_TEMP/ssh/settings.json"
          ssh -o StrictHostKeyChecking=accept-new "$TARGET" 'chmod 600 /root/.qwen/settings.json
            pkill -f "qwen serve" || true; sleep 2
            cd /opt/aflow-lite
            set -a; . lite/deploy/.env; set +a
            export QWEN_SERVE_URL=http://127.0.0.1:4170
            nohup qwen serve --hostname 127.0.0.1 --port 4170 > /tmp/qwen-serve.log 2>&1 &
            for k in $(seq 1 20); do curl -fsS http://127.0.0.1:4170/health >/dev/null 2>&1 && break; sleep 1; done
            echo "qwen health: $(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4170/health)"
            python3 -c "import json;print(\"model:\",json.load(open(\"/root/.qwen/settings.json\"))[\"model\"][\"name\"])"'
          # run a real mission over loopback
          ssh "$TARGET" "curl -s -c /tmp/cj -X POST -H 'content-type: application/json' -d '$BODY' http://127.0.0.1:8765/api/auth/login >/dev/null
          mid=\$(curl -s -b /tmp/cj -X POST -H 'content-type: application/json' -d '{\"goal\":\"只回复六个字：部署验证成功\"}' http://127.0.0.1:8765/api/missions | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"id\"])')
          echo mission=\$mid
          for k in \$(seq 1 40); do
            st=\$(curl -s -b /tmp/cj http://127.0.0.1:8765/api/missions/\$mid | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"mission\"][\"status\"])')
            [ \"\$st\" != pending ] && [ \"\$st\" != running ] && break; sleep 2
          done
          curl -s -b /tmp/cj http://127.0.0.1:8765/api/missions/\$mid | python3 -c 'import sys,json;d=json.load(sys.stdin);s=d[\"steps\"][0];print(\"mission_status=\",d[\"mission\"][\"status\"]);print(\"agent_reply=\",(s[\"result_text\"] or \"\")[:80]);print(\"step_error=\",(s[\"error\"] or \"\")[:120])'
          "
