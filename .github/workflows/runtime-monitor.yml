name: Runtime Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: runtime-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: vars.RUNTIME_DEPLOY_ENABLED == '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write deploy credentials
        env:
          RUNTIME_DEPLOY_SSH_KEY: ${{ secrets.RUNTIME_DEPLOY_SSH_KEY }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/runtime-monitor"
          printf '%s\n' "$RUNTIME_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/runtime-monitor/ssh_key"
          chmod 600 "$RUNNER_TEMP/runtime-monitor/ssh_key"

      - name: Run remote monitor
        env:
          RUNTIME_VPS_HOST: ${{ vars.RUNTIME_VPS_HOST }}
          RUNTIME_VPS_USER: ${{ vars.RUNTIME_VPS_USER }}
          RUNTIME_VPS_SSH_PORT: ${{ vars.RUNTIME_VPS_SSH_PORT }}
          RUNTIME_VPS_SSH_HOST_KEY: ${{ vars.RUNTIME_VPS_SSH_HOST_KEY }}
          RUNTIME_ALERT_WEBHOOK_URL: ${{ secrets.RUNTIME_ALERT_WEBHOOK_URL }}
        run: |
          set -eu
          ssh_port="${RUNTIME_VPS_SSH_PORT:-22}"
          ssh_user="${RUNTIME_VPS_USER:-root}"
          ssh_opts="-i $RUNNER_TEMP/runtime-monitor/ssh_key"
          ssh_opts="$ssh_opts -p ${ssh_port}"
          ssh_opts="$ssh_opts -o StrictHostKeyChecking=yes"
          ssh_opts="$ssh_opts -o ConnectTimeout=15"
          if [ -n "${RUNTIME_VPS_SSH_HOST_KEY:-}" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "${RUNTIME_VPS_SSH_HOST_KEY}" >> ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          fi
          monitor_cmd="python3 /opt/cloud-agents-runtime/scripts/monitor_runtime.py"
          monitor_output=$(ssh $ssh_opts \
            "${ssh_user}@${RUNTIME_VPS_HOST}" \
            "$monitor_cmd --json" 2>&1) || monitor_failed=1
          echo "$monitor_output"
          if [ "${monitor_failed:-0}" = "1" ]; then
            if [ -n "${RUNTIME_ALERT_WEBHOOK_URL:-}" ]; then
              curl -sf -X POST "$RUNTIME_ALERT_WEBHOOK_URL" \
                -H 'Content-Type: application/json' \
                -d "{\"text\": \"aflow runtime monitor FAILED on ${RUNTIME_VPS_HOST}\"}" || true
            fi
            echo "::error::Runtime monitor detected failures"
            exit 1
          fi
