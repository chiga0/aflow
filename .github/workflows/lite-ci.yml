name: aflow-lite CI

on:
  push:
    paths:
      - "lite/**"
      - ".github/workflows/lite-ci.yml"
  pull_request:
    paths:
      - "lite/**"
      - ".github/workflows/lite-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lite-test:
    name: runtime tests + web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lite/web/package-lock.json

      - name: Runtime unit tests (strict, offline)
        run: python3 -W error::ResourceWarning -m unittest discover -s lite/runtime/tests

      - name: Install web dependencies
        working-directory: lite/web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Web typecheck
        working-directory: lite/web
        run: npm run typecheck

      - name: Web production build
        working-directory: lite/web
        run: npm run build

  lite-e2e:
    name: web e2e (no model backend)
    needs: lite-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lite/web/package-lock.json

      - name: Install web dependencies
        working-directory: lite/web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Build web
        working-directory: lite/web
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: lite/web
        run: npx playwright install --with-deps chromium

      - name: Start runtime (no qwen)
        env:
          AFLOW_AUTH_EMAIL: ci@aflow.local
          AFLOW_AUTH_PASSWORD: cipass
          AFLOW_STATIC_DIR: ${{ github.workspace }}/lite/web/dist
        run: |
          set -euo pipefail
          python3 -m lite.runtime --port 8765 > /tmp/lite-runtime.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health >/dev/null 2>&1; then
              echo "runtime up"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/api/health

      - name: Run web e2e
        working-directory: lite/web
        env:
          AFLOW_BASE: http://127.0.0.1:8765
          AFLOW_AUTH_EMAIL: ci@aflow.local
          AFLOW_AUTH_PASSWORD: cipass
        run: node e2e/smoke.test.mjs
