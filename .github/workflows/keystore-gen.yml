name: keystore-gen

# ONE-OFF: regenerate the release keystore and ship it as a run artifact.
# Delete this workflow after the secret is saved.

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: generate keystore
        run: |
          keytool -genkeypair -keystore aflow-release.jks -alias aflow \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "${STORE_PASS}" -keypass "${KEY_PASS}" \
            -dname "CN=AFlow, OU=Dev, O=AFlow, C=CN"
        env:
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: aflow-release.jks
