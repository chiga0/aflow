name: keystore-gen

# ONE-OFF: generates the release signing keystore, prints base64 for secret
# storage. Delete this workflow after the secrets are saved.

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: generate keystore
        run: |
          keytool -genkeypair -keystore /tmp/aflow-release.jks -alias aflow \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "${STORE_PASS}" -keypass "${KEY_PASS}" \
            -dname "CN=AFlow, OU=Dev, O=AFlow, C=CN"
          echo "BASE64_KEYSTORE_BEGIN"
          base64 -w0 /tmp/aflow-release.jks
          echo ""
          echo "BASE64_KEYSTORE_END"
        env:
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
