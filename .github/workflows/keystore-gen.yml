name: keystore-gen

# ONE-OFF: regenerate release keystore with fixed literal passwords and ship
# it as a run artifact. Delete after refreshing ANDROID_KEYSTORE_B64.

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: generate keystore
        run: |
          keytool -genkeypair -keystore aflow-release.jks -alias aflow \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass aflow-release-2026 -keypass aflow-release-2026 \
            -dname "CN=AFlow, OU=Dev, O=AFlow, C=CN"
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: aflow-release.jks
