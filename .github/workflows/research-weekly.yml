name: Research Weekly

on:
  schedule:
    # 每周一 09:00 UTC（北京时间 17:00）
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure qwen-code
        run: |
          if [ -z "$QWEN_SETTINGS_JSON" ]; then
            echo "::error::QWEN_SETTINGS_JSON secret is not configured."
            echo "Add it via: gh secret set QWEN_SETTINGS_JSON"
            exit 1
          fi
          mkdir -p ~/.qwen
          echo "$QWEN_SETTINGS_JSON" > ~/.qwen/settings.json
        env:
          QWEN_SETTINGS_JSON: ${{ secrets.QWEN_SETTINGS_JSON }}

      - name: Install qwen-code
        run: npm install -g @qwen-code/qwen-code

      - name: Run research agent
        run: |
          qwen --print "$(cat .github/prompts/research-weekly.md)"
        timeout-minutes: 30

      - name: Refresh dashboard
        run: python scripts/research_status.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/research/
          if git diff --cached --quiet; then
            echo "No research changes this week."
          else
            git commit -m "chore(research): weekly agent-driven update [skip ci]"
            git push
          fi
