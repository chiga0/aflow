name: Research Weekly

on:
  schedule:
    # 每周一 09:00 UTC（北京时间 17:00）
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate research dashboard
        run: python scripts/research_status.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/research/dashboard.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(research): weekly dashboard update [skip ci]"
            git push
          fi
