<!doctype html>
<html lang="zh-CN" style="background: #09090b">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="AFlow — 自托管 Agent 运行时：描述目标，Agent 规划、执行并交付结果。"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AFlow" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <title>AFlow · Agent Runtime</title>
    <!-- Inline critical styles: the standalone PWA webview paints before the
         external CSS loads; without an opaque background the iOS homescreen
         flashes through during launch. -->
    <style>
      html, body { background: #09090b; margin: 0; height: 100%; overflow: hidden; }
      #root { height: 100%; }
    </style>
    <script>
      // Last-resort error surface: only shown if React never mounts the root.
      // The inline splash counts as a child, so drop it first or a boot
      // failure would hide behind the placeholder forever.
      function surfaceError(html) {
        var splash = document.getElementById("splash");
        if (splash) splash.remove();
        var el = document.getElementById("root");
        if (el && !el.children.length) el.innerHTML = html;
      }
      window.onerror = function (msg, url, line, col, err) {
        surfaceError(
          '<pre style="color:#f87171;padding:20px;white-space:pre-wrap;font-size:13px">' +
          "JS Error:\n" + msg + "\n\n" + (err && err.stack ? err.stack : "") + "</pre>");
      };
      window.addEventListener("unhandledrejection", function (e) {
        surfaceError(
          '<pre style="color:#f87171;padding:20px;white-space:pre-wrap;font-size:13px">' +
          "Unhandled Promise:\n" + String(e.reason) + "</pre>");
      });
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased">
    <div id="root">
      <!-- inline launch splash; React replaces it on first render -->
      <div id="splash" style="position: fixed; inset: 0; background: #09090b; display: grid; place-items: center">
        <img src="/logo-128.png" width="72" height="72" alt="" style="border-radius: 18px" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
