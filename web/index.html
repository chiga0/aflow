<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="AFlow — 自托管 Agent 运行时：描述目标，Agent 规划、执行并交付结果。"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AFlow" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>AFlow · Agent Runtime</title>
    <script>
      // Last-resort error surface: only shown if React never mounts the root.
      window.onerror = function (msg, url, line, col, err) {
        var el = document.getElementById("root");
        if (el && !el.children.length) {
          el.innerHTML =
            '<pre style="color:#f87171;padding:20px;white-space:pre-wrap;font-size:13px">' +
            "JS Error:\n" + msg + "\n\n" + (err && err.stack ? err.stack : "") +
            "</pre>";
        }
      };
      window.addEventListener("unhandledrejection", function (e) {
        var el = document.getElementById("root");
        if (el && !el.children.length) {
          el.innerHTML =
            '<pre style="color:#f87171;padding:20px;white-space:pre-wrap;font-size:13px">' +
            "Unhandled Promise:\n" + String(e.reason) +
            "</pre>";
        }
      });
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
