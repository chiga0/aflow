# aflow-lite with the pi execution engine (no qwen daemon).
#
#   docker compose -f deploy/docker-compose.pi.yml up -d --build
#
# Required env (or .env next to this file):
#   PI_ENGINE_API_KEY   model key (Bailian token-plan endpoint by default)
# Optional:
#   PI_ENGINE_MODEL     default qwen3.8-max
#   PI_ENGINE_BASE_URL  default token-plan OpenAI-compatible endpoint
#   AFLOW_AUTH_PASSWORD web login password (bootstrap password if unset)
#
# pi runs as short-lived RPC subprocesses of the runtime: ~180MB peak per
# session on a 1.6GB VPS (vs ~243MB resident for the qwen daemon), and the
# process exits when the session is reaped.

services:
  aflow:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "${AFLOW_PORT:-8765}:8765"
    environment:
      AFLOW_ENGINE: pi
      PI_ENGINE_API_KEY: ${PI_ENGINE_API_KEY:?set PI_ENGINE_API_KEY (model key)}
      PI_ENGINE_MODEL: ${PI_ENGINE_MODEL:-qwen3.8-max}
      PI_ENGINE_BASE_URL: ${PI_ENGINE_BASE_URL:-https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      PI_ENGINE_CWD: /workspace
      AFLOW_AUTH_EMAIL: ${AFLOW_AUTH_EMAIL:-admin@aflow.local}
      AFLOW_AUTH_PASSWORD: ${AFLOW_AUTH_PASSWORD:-}
      AFLOW_CORS_ORIGIN: ${AFLOW_CORS_ORIGIN:-*}
    volumes:
      - data:/app/data
      - workspace:/workspace
    restart: unless-stopped

volumes:
  data:
  workspace:
