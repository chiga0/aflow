# aflow-lite + qwen serve. Bring up with:
#   docker compose -f lite/deploy/docker-compose.yml up -d --build
#
# Model credentials are read from your host ~/.qwen (mounted read-only into the
# qwen container). Set AFLOW_AUTH_PASSWORD in the environment (or a .env file
# next to this compose file) for the web login; leave it empty to have the
# runtime generate a bootstrap password into the `data` volume on first start.
#
# The aflow container talks to qwen over the compose network using a shared
# internal token (QWEN_SERVE_TOKEN) — qwen binds 0.0.0.0 so it requires one.

services:
  aflow:
    build:
      context: ../..
      dockerfile: lite/deploy/Dockerfile
    ports:
      - "8765:8765"
    environment:
      QWEN_SERVE_URL: http://qwen:4170
      QWEN_SERVE_TOKEN: ${QWEN_SERVE_TOKEN:-aflow-internal-token-change-me}
      AFLOW_AUTH_EMAIL: ${AFLOW_AUTH_EMAIL:-admin@aflow.local}
      AFLOW_AUTH_PASSWORD: ${AFLOW_AUTH_PASSWORD:-}
      AFLOW_CORS_ORIGIN: ${AFLOW_CORS_ORIGIN:-*}
    volumes:
      - data:/app/data
    depends_on:
      qwen:
        condition: service_healthy
    restart: unless-stopped

  qwen:
    build:
      context: ../..
      dockerfile: lite/deploy/Dockerfile.qwen
      args:
        QWEN_VERSION: ${QWEN_VERSION:-0.21.1}
    environment:
      QWEN_SERVER_TOKEN: ${QWEN_SERVE_TOKEN:-aflow-internal-token-change-me}
      HOME: /root
    volumes:
      - ${HOME}/.qwen:/root/.qwen:ro
      - workspace:/workspace
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4170/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  data:
  workspace:
