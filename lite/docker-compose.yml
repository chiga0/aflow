services:
  aflow:
    build:
      context: ..
      dockerfile: lite/Dockerfile
    ports:
      - "8765:8765"
    environment:
      - QWEN_SERVE_URL=http://qwen:4170
      # - QWEN_SERVE_TOKEN=your-token
    volumes:
      - data:/app/data
    restart: unless-stopped

  qwen:
    image: qwen-code/qwen:latest
    command: qwen serve --hostname 0.0.0.0 --port 4170
    volumes:
      - workspace:/workspace
    restart: unless-stopped

volumes:
  data:
  workspace:
